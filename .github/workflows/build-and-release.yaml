name: Build and Release Zed OpenGL

on:
  push:
    branches:
      - alpha
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0). Leave empty for auto-generated SHA tag.'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Zed OpenGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build Zed OpenGL package
        run: |
          nix build .#zeditor-opengl-src
          tar -czvf zed-opengl-x86_64-linux.tar.gz -C result .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: zed-opengl-x86_64-linux.tar.gz
          archive: false
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          path: ./zed-opengl-x86_86-linux.tar.gz

      - name: Create release and upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || format('zed-opengl-{0}', github.sha) }}
        run: |
          REPO="${{ github.repository }}"
          
          # Create the release
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Auto-build: $TAG" \
            --notes "Automated OpenGL build of Zed editor for commit ${{ github.sha }}"
          
          # Upload the exact tar.gz file. 
          # Because we used 'path: .', the file is now in the current directory.
          gh release upload "$TAG" zed-opengl-x86_64-linux.tar.gz --repo "$REPO"
